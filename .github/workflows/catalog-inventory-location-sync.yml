name: Catalog inventory sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-inventory-location-sync.yml'
      - '.github/scripts/patch_catalog_inventory.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch catalog
        run: python .github/scripts/patch_catalog_inventory.py
      - name: Validate
        run: |
          grep -q 'CATALOGO_V35_INVENTARIO_ACTIVO' index.html
          grep -q 'id:"lomas-del-prado"' index.html
          grep -q 'function mapUrlForModel' index.html
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: completar desarrollos activos y ubicaciones Maps"
          git pull --rebase origin main
          git push origin HEAD:main
