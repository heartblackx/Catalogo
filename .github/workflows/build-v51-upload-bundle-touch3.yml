name: Trigger bundle artifact 3
on:
  push:
    paths:
      - '.github/workflows/build-v51-upload-bundle-touch3.yml'
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -q 'CATALOGO_V51_HORIZONTAL_DEVELOPMENT_CARDS' index.html
      - run: |
          mkdir -p bundle
          shopt -s dotglob
          for item in *; do
            case "$item" in .git|.github|scripts|bundle) ;; *) cp -a "$item" bundle/ ;; esac
          done
          printf 'Catalogo V51 manual Cloudflare upload\nBuilt from main commit: %s\n' "$(git rev-parse HEAD)" > bundle/DEPLOY_VERSION.txt
          cd bundle && zip -qr ../Catalogo-V51-Cloudflare.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Catalogo-V51-Cloudflare
          path: Catalogo-V51-Cloudflare.zip
          retention-days: 7
