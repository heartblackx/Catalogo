name: Export campestre photos once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-campestre-photos-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download Campestre photos through image proxy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p campestre_fotos
          cat > /tmp/urls.txt <<'EOF'
          https://lh3.googleusercontent.com/sitesv/AG8ngQWD_9I5czaAKAhE7PzruSVzsiD5LaCsSKlDPm02Mf4kshqBSFL_OKFUrUB5G9SUEg9itUWFKY06CYhf5uPnu1l-4W8q-3Bcgmrm6rrxibdz5LP2XTcbl6t0Pv3wq5uG3nZN6cQd_anHoHcFbH7vzWH9u6J4waYrgN34AdVOEce7yQZrWM83AbMPdXKn=w16383
