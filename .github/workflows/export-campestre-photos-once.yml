name: Export campestre photos once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-campestre-photos-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download Campestre carousel photos with headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME=""
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then CHROME="$(command -v "$c")"; break; fi
          done
          [ -n "$CHROME" ] || { echo "Chrome not found" >&2; exit 1; }
          mkdir -p campestre_fotos
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/chrome-profile about:blank >/tmp/chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do
            curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break
            sleep 0.25
          done
          cat > /tmp/export.js <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const siteUrl = 'https://sites.google.com/view/invierte-inteligente-tj/p%C3%A1gina-principal/campestre';
          const urls = [
            'https://lh3.googleusercontent.com/sitesv/AG8ngQWD_9I5czaAKAhE7PzruSVzsiD5LaCsSKlDPm02Mf4kshqBSFL_OKFUrUB5G9SUEg9itUWFKY06CYhf5uPnu1l-4W8q-3Bcgmrm6rrxibdz5LP2XTcbl6t0Pv3wq5uG3nZN6cQd_anHoHcFbH7vzWH9u6J4waYrgN34AdVOEce7yQZrWM83AbMPdXKn=w16383',
            'https://lh3.googleusercontent.com/sitesv/AG8ngQWC1W1U2R7Jx8HAeNjWv79wFPOWZyjbCED3UCBgBinHWB_TxOuM4os92tXLPY2fjILs9snQEeWcRLPhmvVXj_Zq2Lsypvmta3gjhdu7tKyfWUG5vllx6WLTd2Jz9u18FnWpmKWNqzitD1anMf56fjxulNMePXuqlH1I6an6DmHi1cMywxNXdBrlkLgkGrg=w16383',
            'https://lh3.googleusercontent.com/sitesv/AG8ngQXX53BIkOEtNetwqDB46mOKU0Zx1fiQzRgsz4XkwDZefvy64ugWJLS6GCqs56RZgb6kO-z5dDvMOqHgBSEnRwXSFR9Yfn4Cygt9VR1WbMpMyq1H6FVKC-063fT2Ulpxw4G4i8cGBOZIzLI84yLsoVkaHg6ertj-XxWCrThnwaDnbYJV5gQJ0GLUHQXw=w16383',
            'https://lh3.googleusercontent.com/sitesv/AG8ngQX-6PuLuBEfH847B3nnXgrRCVbdCfeiUeybjD2REETQ8z5eUzot3Oh_9MXlC5oC2edcrXD5YBxqQmhYl61_4q9ZzU-wb-h90vTYj532SZ_RpCQr3o_V9fECdb2igJ2rmSYyInq-9hhd8mJsugqHasuh3PsyByQ4EtJ8lkC-99kzv8B0ngv-Ng0Zd2bU=w16383',
            'https://lh3.googleusercontent.com/sitesv/AG8ngQVfB2stMHr6Vj_KVxwYfVn-CHsOuXCZuuSe3NGpJuXzOZWhhYUIwW1pHz0rO_QnA6Tnsd1icLScXNKGqWNuGgs_B06l4B1IIDALT3XiLkG_EgABu_VLWVUC5z73gYHM9PPSE1j1R__k-ABJ1kG_hzGsMAU2NTQY7pxobf8kHyT-JPLvc5ZtfVXgPVdA=w16383',
            'https://lh3.googleusercontent.com/sitesv/AG8ngQWQyg2V-lyUIwCKfaH_RDa1LtMgDaRJswVHyQDRdCzRepjPyktlCeD9Y4CwoucHZV8WFnkN7VpnAtGgipP_Xr1_MVWKQUc8RPaUq_7J7dKV3SOFL5F92APH-GeBq6PxbIiiaOrVYQXAzALCqxwNhqYrTWXM_uHvHlOxGSZawOntzc8XdOc0pYRgI7su9lw=w16383',
            'https://lh3.googleusercontent.com/sitesv/AG8ngQUl-vj6m69Hf_ApaejM2D8PxIdewO7Yii1PER0pmJV2z4h0gdddKZ_diWEojJUl6lJtbk10x_m2RnCfkjOiDzTSxy59AdD1wmWwlgOGGwDDwpkTTcbPADwUpSWOT8U4LTA2MfxjqCx4JjJ8SwmcxOsDVb2Z7TzFDmVzjwwy-Ux99i-rCd-97o2MvjciFFk=w16383',
            'https://lh3.googleusercontent.com/sitesv/AG8ngQXE0YDiXlj1JgwBXHABc96BCAS5j-on_tKvc1MKaKtGTVEPZYqlWJYgYuYs3YClavUmPXP2EWyzbm9vJwmcALxfHSJ3zW0DNo6rSo9veIFtv0y3j2mbAIVPojIVvIVB2qAjd3kxKIO5hbyBqYdDPkk2EAjmXN02wdTaCsPtzY-9e70HDnBFFV5iJy94cw0=w16383',
            'https://lh3.googleusercontent.com/sitesv/AG8ngQWE1o0vkK11cqz6x8yupqyJpT8h-5caeetYTTMgo-PJ8w7AhUOkBNwLe4F5r_O7czGrXOhyJ_7oCS_-6dfAnm43ekUjY7lu-SgvQHtGRMI-n_FJDXdHER8KXk0-ajPEJQOq3t-q279UenHgQA_X_onVZgi3_V4mCrixDxCrc36cLf5c_qwSf7dzMcKA1r8=w16383',
            'https://lh3.googleusercontent.com/sitesv/AG8ngQVGEVqXqyVdWc607BhuVxMRL5fSKFj1aWs_ekWknGiN55atEW4C_BnGaQ-Sb0ZCS6SwrzS2M0lyu9lxvJ2G7rcB95mzT7ExKnYQljO5sH8aD65l5K-73FTvFQ36Ox4NeNWWegbInC8qMSRdYmHPfrqSmM1wovQoOLNXCNKydXa3PxytBFRO6ucusuf5kuQ=w16383',
            'https://lh3.googleusercontent.com/sitesv/AG8ngQXl9VRW0l8jUTwcsn3mfwo04yLqgDyzVUZaLV9_Y6vt4Vh71qZEOp8_HcRQO2Uzy4Tjf0DsUZdozrbKM9A96ziZaIUd7TGZMr4axjlnwqm63GxvcvuN1lrIghv9L2fKBoq5zQPuyDXmw_dYnIEk-U0Q8VHzmMAp_8wWtau5ZtqMrYac9sWbSy5wm6Qh=w16383'
          ];
          const sleep = ms => new Promise(r=>setTimeout(r,ms));
          async function main(){
            const t = await fetch('http://127.0.0.1:9222/json/new?about:blank',{method:'PUT'}).then(r=>r.json());
            const ws = new WebSocket(t.webSocketDebuggerUrl);
            await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});
            let id=0; const pending=new Map(); const listeners=[];
            ws.onmessage=ev=>{
              const m=JSON.parse(ev.data);
              if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);return;}
              for(const fn of [...listeners]) fn(m);
            };
            const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}))});
            const waitEvent=(method,timeout=60000)=>new Promise((resolve,reject)=>{const fn=m=>{if(m.method===method){clearTimeout(tm);listeners.splice(listeners.indexOf(fn),1);resolve(m.params||{})}};listeners.push(fn);const tm=setTimeout(()=>{const k=listeners.indexOf(fn);if(k>=0)listeners.splice(k,1);reject(new Error('timeout '+method))},timeout)});
            await send('Page.enable');
            await send('Runtime.enable');
            await send('Network.enable',{maxTotalBufferSize:150000000,maxResourceBufferSize:60000000});
            await send('Network.setCacheDisabled',{cacheDisabled:true});
            const targetIndex = new Map(urls.map((u,i)=>[u,i]));
            const requestMeta = new Map();
            const saved = new Map();
            listeners.push(m=>{
              if(m.method==='Network.responseReceived'){
                const p=m.params||{}, u=p.response?.url||'';
                if(targetIndex.has(u)){
                  console.log('response',targetIndex.get(u)+1,p.response.status,p.response.mimeType,u);
                  if(p.response.status===200 && (p.response.mimeType||'').startsWith('image/')) requestMeta.set(p.requestId,{url:u,mime:p.response.mimeType});
                }
              }
              if(m.method==='Network.loadingFinished' && requestMeta.has(m.params?.requestId)){
                const rid=m.params.requestId, meta=requestMeta.get(rid);
                (async()=>{
                  try{
                    const body=await send('Network.getResponseBody',{requestId:rid});
                    const buf=body.base64Encoded?Buffer.from(body.body,'base64'):Buffer.from(body.body,'binary');
                    const i=targetIndex.get(meta.url);
                    const ext=meta.mime.includes('webp')?'webp':meta.mime.includes('png')?'png':'jpg';
                    const name=`campestre_${String(i+1).padStart(2,'0')}.${ext}`;
                    fs.writeFileSync(path.join('campestre_fotos',name),buf);
                    saved.set(meta.url,name);
                    console.log('saved',name,buf.length,'total',saved.size);
                  }catch(e){console.error('save error',e.message)}
                })();
              }
            });
            let load=waitEvent('Page.loadEventFired');
            await send('Page.navigate',{url:siteUrl});
            await load.catch(()=>{});
            await sleep(2500);
            const expression = `(() => { const urls=${JSON.stringify(urls)}; window.__imgs=urls.map(u=>{const im=new Image();im.style.position='fixed';im.style.left='-99999px';im.style.width='1px';im.style.height='1px';im.src=u;document.body.appendChild(im);return im;}); return urls.length; })()`;
            const ev=await send('Runtime.evaluate',{expression,returnByValue:true});
            console.log('injected',ev.result?.value);
            for(let s=0;s<80 && saved.size<urls.length;s++) await sleep(500);
            console.log('final saved',saved.size,'of',urls.length);
            if(saved.size!==urls.length){
              console.log('missing',urls.filter(u=>!saved.has(u)));
              process.exitCode=2;
            }
            ws.close();
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/export.js
          test "$(find campestre_fotos -type f | wc -l)" -eq 11
          file campestre_fotos/*
          zip -j campestre_fotos.zip campestre_fotos/*
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: campestre-fotos
          path: campestre_fotos.zip
          if-no-files-found: error
          retention-days: 1
