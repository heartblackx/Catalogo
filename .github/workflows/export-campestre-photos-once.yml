          https://lh3.googleusercontent.com/sitesv/AG8ngQXl9VRW0l8jUTwcsn3mfwo04yLqgDyzVUZaLV9_Y6vt4Vh71qZEOp8_HcRQO2Uzy4Tjf0DsUZdozrbKM9A96ziZaIUd7TGZMr4axjlnwqm63GxvcvuN1lrIghv9L2fKBoq5zQPuyDXmw_dYnIEk-U0Q8VHzmMAp_8wWtau5ZtqMrYac9sWbSy5wm6Qh=w16383
          EOF
          i=0
          while IFS= read -r url; do
            i=$((i+1))
            enc=$(python - <<PY
          import urllib.parse
          print(urllib.parse.quote('''$url''', safe=''))
          PY
          )
            out=$(printf 'campestre_fotos/campestre_%02d.jpg' "$i")
            proxy="https://images.weserv.nl/?url=${enc}&output=jpg&q=95"
            echo "Downloading $i"
            curl -fL --retry 2 --connect-timeout 20 --max-time 90 -A 'Mozilla/5.0' "$proxy" -o "$out"
            file "$out"
          done < /tmp/urls.txt
          test "$(find campestre_fotos -type f | wc -l)" -eq 11
          zip -j campestre_fotos.zip campestre_fotos/*
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: campestre-fotos
          path: campestre_fotos.zip
          if-no-files-found: error
          retention-days: 1
