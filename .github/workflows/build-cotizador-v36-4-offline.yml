name: Build cotizador V36.4 offline

on:
  push:
    branches: [cotizador-v36-4-offline-fix]
    paths:
      - '.github/workflows/build-cotizador-v36-4-offline.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cotizador-v36-4-offline-fix

      - name: Recover current cotizador and apply V36.4 offline fix
        shell: bash
        env:
          SW_B64: ""
        run: |
          set -euo pipefail
          base='https://invierte-inteligente.pages.dev'
          files=(index.html cotizador.html clientes.html admin.html crm.html perfil.html cotizador_admin_v22.html offline-core.js map-manifest.json assets/mapas/lomas-del-prado.svg assets/mapas/paramo.svg assets/data/vive-la-baja-desarrollos.json assets/data/vive-paramo-inventory-snapshot.json assets/geo/baja-california-municipios.geojson)
          for f in "${files[@]}"; do
            mkdir -p "$(dirname "$f")"
            curl -fsSL --retry 4 --retry-delay 2 "$base/$f?source=v36_4_repair" -o "$f"
            test -s "$f"
          done
          test "$(wc -c < index.html)" -gt 300000
          grep -q 'offline-core.js' index.html
          printf '%s' "$SW_B64" | base64 -d > sw.js
          python - <<'PY'
          from pathlib import Path
          for fn in ['index.html','cotizador.html','clientes.html','admin.html','crm.html','perfil.html','cotizador_admin_v22.html','offline-core.js']:
              p=Path(fn)
              s=p.read_text(encoding='utf-8')
              s=s.replace('36.3','36.4')
              p.write_text(s,encoding='utf-8')
          Path('VERSION.txt').write_text('Cotizador Offline V36.4\n',encoding='utf-8')
          Path('V36_4_OFFLINE_FIX.txt').write_text('V36.4 OFFLINE ROUTE FIX\n- Corrige navegación offline por ruta: clientes.html, cotizador.html, admin.html, crm.html y perfil.html conservan su propia pantalla.\n- Los parámetros ?v=, ?ref= y otros query strings ya no crean una copia distinta para el modo offline.\n- Evita que clientes.html termine mostrando index.html/cotizador.html cuando no hay conexión.\n- Renueva caché de app shell a ii-cotizador-v36.4-* y conserva permanentemente ii-cotizador-v36-maps.\n- Mantiene la estrategia online-first para navegación y copia local para caídas de red.\n',encoding='utf-8')
          PY
          grep -q "sw.js?v=36.4" index.html
          grep -q "ii-cotizador-v36.4-runtime" index.html
          grep -q "const CORE='ii-cotizador-v36.4-core'" sw.js
          grep -q "'/clientes.html','./clientes.html'" sw.js

      - name: Commit isolated cotizador build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html cotizador.html clientes.html admin.html crm.html perfil.html cotizador_admin_v22.html offline-core.js sw.js VERSION.txt V36_4_OFFLINE_FIX.txt map-manifest.json assets/mapas/lomas-del-prado.svg assets/mapas/paramo.svg assets/data/vive-la-baja-desarrollos.json assets/data/vive-paramo-inventory-snapshot.json assets/geo/baja-california-municipios.geojson
          git commit -m 'fix: cotizador V36.4 offline por ruta [skip ci]'
          git push origin HEAD:cotizador-v36-4-offline-fix
