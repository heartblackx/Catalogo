name: SEO city pages V44 preview

on:
  push:
    branches: [seo-city-pages-preview]

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-city-pages-preview
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply city route support
        run: python .github/scripts/seo_city_route_v44_patch.py
      - name: Validate files
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for slug in ('tijuana','rosarito','ensenada'):
              p=Path(slug)/'index.html'
              s=p.read_text(encoding='utf-8')
              assert '<h1>' in s
              assert 'seo-city.js' in s
              assert f'/{slug}/' in s
          root=Path('index.html').read_text(encoding='utf-8')
          assert 'SEO_CITY_ROUTE_V44' in root
          ET.parse('sitemap.xml')
          print('V44 static validation OK')
          PY
      - name: Commit generated root route support
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit'
            exit 0
          fi
          git config user.name 'HBX Catalog Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'seo: habilitar enlaces filtrados por ciudad V44'
          git push origin seo-city-pages-preview
