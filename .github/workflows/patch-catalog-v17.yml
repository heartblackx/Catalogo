name: Patch catalog V17 trust and promotion polish
on:
  push:
    branches: ["assistant/catalog-v17-confianza"]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/catalog-v17-confianza
      - name: Polish public catalog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Social/share preview + SEO/trust metadata.
          if 'CATALOGO_V17_TRUST_META' not in s:
              meta='''\n<!-- CATALOGO_V17_TRUST_META -->\n<meta name="description" content="Explora terrenos disponibles en Baja California, compara enganche, mensualidad, plazo y ubicación, y recibe atención directa de un asesor de Invierte Inteligente TJ.">\n<meta name="theme-color" content="#0b3040">\n<link rel="canonical" href="https://catalogo.invierteinteligentetj.com/">\n<meta property="og:type" content="website">\n<meta property="og:locale" content="es_MX">\n<meta property="og:site_name" content="Invierte Inteligente TJ">\n<meta property="og:title" content="Terrenos disponibles | Invierte Inteligente TJ">\n<meta property="og:description" content="Consulta lotes reales, compara financiamiento en USD o MXN y agenda atención con un asesor.">\n<meta property="og:url" content="https://catalogo.invierteinteligentetj.com/">\n<meta property="og:image" content="https://grupoconcordia.info/gcexperience/Banners/VillaParaiso-VLB.jpg">\n<meta property="og:image:alt" content="Terrenos disponibles en Baja California">\n<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:title" content="Terrenos disponibles | Invierte Inteligente TJ">\n<meta name="twitter:description" content="Lotes disponibles, cotización y atención inmobiliaria directa.">\n<meta name="twitter:image" content="https://grupoconcordia.info/gcexperience/Banners/VillaParaiso-VLB.jpg">\n<script type="application/ld+json">\n{\n  "@context":"https://schema.org",\n  "@type":"RealEstateAgent",\n  "name":"Invierte Inteligente TJ",\n  "url":"https://catalogo.invierteinteligentetj.com/",\n  "areaServed":["Tijuana","Rosarito","Ensenada","Baja California"],\n  "employee":[\n    {"@type":"Person","name":"Eduardo Delgado","jobTitle":"Asesor inmobiliario","telephone":"+52 663 458 1218"},\n    {"@type":"Person","name":"Carlos Conde","jobTitle":"Asesor inmobiliario","telephone":"+52 664 568 7574"}\n  ]\n}\n</script>\n<!-- /CATALOGO_V17_TRUST_META -->\n'''
              needle='<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
              s=s.replace(needle, needle+meta, 1)

          # Public navigation: offices + direct advisor contact.
          old_nav='''    <nav class="navlinks">\n      <a href="#desarrollos">Desarrollos</a>\n      <a href="#lotes">Lotes</a>\n      <a href="#cotiza">Cotizar</a>\n      <a href="#desarrollos" class="primary">Explorar catálogo</a>\n    </nav>'''
          new_nav='''    <nav class="navlinks">\n      <a href="#desarrollos">Desarrollos</a>\n      <a href="#lotes">Lotes</a>\n      <a href="#oficinas">Oficinas</a>\n      <a href="#cotiza">Cotizar</a>\n      <a href="#asesores" class="primary">Hablar con asesor</a>\n    </nav>'''
          if old_nav in s:
              s=s.replace(old_nav,new_nav,1)

          # Add an above-the-fold trust/contact action.
          old_hero='''      <div class="hero-actions">\n        <a href="#desarrollos" class="btn btn-aqua">Ver desarrollos <span>→</span></a>\n        <a href="#lotes" class="btn btn-glass">Ver lotes disponibles</a>\n      </div>'''
          new_hero='''      <div class="hero-actions">\n        <a href="#desarrollos" class="btn btn-aqua">Ver desarrollos <span>→</span></a>\n        <a href="#lotes" class="btn btn-glass">Ver lotes disponibles</a>\n        <a href="#oficinas" class="btn btn-glass">Oficinas y asesores</a>\n      </div>\n      <div class="hero-proof" aria-label="Elementos de confianza">\n        <span>✓ Inventario conectado</span><span>✓ USD / MXN</span><span>✓ Ubicaciones en Maps</span><span>✓ Atención por asesor</span>\n      </div>'''
          if old_hero in s:
              s=s.replace(old_hero,new_hero,1)

          # Trust / advisor / office section inside main, before footer.
          if 'CATALOGO_V17_TRUST_SECTION' not in s:
              trust='''\n<!-- CATALOGO_V17_TRUST_SECTION -->\n<section class="trust-section" id="confianza">\n  <div class="container">\n    <div class="trust-head">\n      <div>\n        <div class="kicker">Atención inmobiliaria</div>\n        <h2>Información clara y personas reales para atenderte</h2>\n        <p>Consulta disponibilidad, compara opciones y agenda una cita. La información comercial se muestra desde la base vigente y un asesor confirma los detalles de tu operación.</p>\n      </div>\n      <a class="trust-map-cta" href="#oficinas">Ver oficinas de atención <span>→</span></a>\n    </div>\n    <div class="trust-grid">\n      <article><span class="trust-icon">↻</span><strong>Inventario actualizado</strong><p>Los lotes y su disponibilidad se consultan desde el inventario conectado al catálogo.</p></article>\n      <article><span class="trust-icon">$</span><strong>Cotiza en USD o MXN</strong><p>Compara enganche, saldo, mensualidad y plazo antes de solicitar atención.</p></article>\n      <article><span class="trust-icon">⌖</span><strong>Ubicaciones reales</strong><p>Los desarrollos y oficinas con liga registrada abren directamente en Google Maps.</p></article>\n      <article><span class="trust-icon">✓</span><strong>Seguimiento personal</strong><p>Las citas se asignan a un asesor para continuar el proceso y confirmar condiciones.</p></article>\n    </div>\n  </div>\n</section>\n\n<section class="advisor-section" id="asesores">\n  <div class="container">\n    <div class="advisor-shell">\n      <div class="advisor-copy">\n        <div class="kicker">Asesores de atención</div>\n        <h2>¿Prefieres hablar con una persona?</h2>\n        <p>Puedes comunicarte directamente con nuestros asesores para resolver dudas, confirmar disponibilidad o dar seguimiento a una cita.</p>\n      </div>\n      <div class="advisor-grid">\n        <article class="advisor-card">\n          <div class="advisor-avatar">ED</div>\n          <div class="advisor-info"><span>Asesor inmobiliario</span><h3>Eduardo Delgado</h3><a class="advisor-phone" href="tel:+526634581218">+52 663 458 1218</a></div>\n          <div class="advisor-actions"><a href="tel:+526634581218">Llamar</a><a class="wa" target="_blank" rel="noopener noreferrer" href="https://wa.me/526634581218?text=Hola%2C%20vi%20el%20cat%C3%A1logo%20de%20Invierte%20Inteligente%20TJ%20y%20quiero%20informaci%C3%B3n%20de%20un%20terreno.">WhatsApp</a></div>\n        </article>\n        <article class="advisor-card">\n          <div class="advisor-avatar">CC</div>\n          <div class="advisor-info"><span>Asesor inmobiliario</span><h3>Carlos Conde</h3><a class="advisor-phone" href="tel:+526645687574">+52 664 568 7574</a></div>\n          <div class="advisor-actions"><a href="tel:+526645687574">Llamar</a><a class="wa" target="_blank" rel="noopener noreferrer" href="https://wa.me/526645687574?text=Hola%2C%20vi%20el%20cat%C3%A1logo%20de%20Invierte%20Inteligente%20TJ%20y%20quiero%20informaci%C3%B3n%20de%20un%20terreno.">WhatsApp</a></div>\n        </article>\n      </div>\n    </div>\n  </div>\n</section>\n\n<section class="office-section" id="oficinas">\n  <div class="container">\n    <div class="office-head">\n      <div>\n        <div class="kicker">Puntos de atención</div>\n        <h2>Oficinas Vive La Baja</h2>\n        <p>Estas ubicaciones se cargan desde la base de oficinas registrada en Supabase. Pulsa una oficina para abrir su liga de Google Maps.</p>\n      </div>\n      <div class="office-count" id="officeCount">Cargando ubicaciones…</div>\n    </div>\n    <div class="office-grid" id="officeGrid"><div class="office-empty">Consultando oficinas registradas…</div></div>\n  </div>\n</section>\n\n<section class="promo-ready-section">\n  <div class="container promo-ready">\n    <div><span class="promo-check">✓</span><div><strong>Consulta antes de decidir</strong><p>Disponibilidad, promociones, tipo de cambio y condiciones pueden cambiar. La información final de la operación debe ser confirmada por un asesor.</p></div></div>\n    <a href="#desarrollos">Explorar terrenos <span>→</span></a>\n  </div>\n</section>\n<!-- /CATALOGO_V17_TRUST_SECTION -->\n'''
              s=s.replace('</main>\n\n<footer>',trust+'\n</main>\n\n<footer>',1)

          # Dedicated styling for the public trust phase.
          if 'CATALOGO_V17_TRUST_CSS' not in s:
              css='''\n/* CATALOGO_V17_TRUST_CSS */\n.hero-proof{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.hero-proof span{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#d8ecec;font-size:.68rem;font-weight:850}\n.trust-section{padding:78px 0 46px;background:linear-gradient(180deg,#fbf7f1,#f4eee5)}\n.trust-head,.office-head{display:flex;align-items:end;justify-content:space-between;gap:28px;margin-bottom:28px}.trust-head h2,.advisor-copy h2,.office-head h2{margin:6px 0 0;font-size:clamp(2rem,4vw,3.7rem);letter-spacing:-.045em;line-height:.98}.trust-head p,.advisor-copy p,.office-head p{max-width:720px;color:#6d7a80;line-height:1.7;margin:15px 0 0}.trust-map-cta{flex:none;padding:13px 18px;border-radius:999px;background:#0b5665;color:#fff;font-weight:900;box-shadow:0 10px 26px rgba(11,86,101,.16)}\n.trust-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.trust-grid article{background:#fffdf9;border:1px solid #e5d9ca;border-radius:20px;padding:20px;box-shadow:0 10px 26px rgba(11,31,41,.04)}.trust-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#e4f5f2;color:#0c6470;font-weight:950;margin-bottom:14px}.trust-grid strong{display:block;font-size:.96rem}.trust-grid p{margin:7px 0 0;color:#748087;font-size:.78rem;line-height:1.55}\n.advisor-section{padding:46px 0 54px;background:#f4eee5}.advisor-shell{padding:32px;border-radius:30px;background:radial-gradient(circle at 90% 10%,rgba(121,215,206,.15),transparent 25%),linear-gradient(135deg,#061d28,#0b4554);color:#fff;display:grid;grid-template-columns:.85fr 1.4fr;gap:28px;align-items:center;box-shadow:0 26px 60px rgba(5,30,40,.18)}.advisor-copy .kicker{color:#8ee1da}.advisor-copy p{color:#c5d8dc}.advisor-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.advisor-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:center}.advisor-avatar{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#83e0d6,#e9cf96);color:#07303a;font-weight:950}.advisor-info span{display:block;color:#9fcbd0;text-transform:uppercase;letter-spacing:.08em;font-size:.58rem;font-weight:900}.advisor-info h3{margin:4px 0 2px;font-size:1.05rem}.advisor-phone{color:#fff;font-size:.84rem;font-weight:800}.advisor-actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}.advisor-actions a{padding:10px;border-radius:11px;text-align:center;background:rgba(255,255,255,.1);color:#fff;font-size:.75rem;font-weight:900;border:1px solid rgba(255,255,255,.1)}.advisor-actions .wa{background:#22a85a;border-color:#22a85a}\n.office-section{padding:70px 0;background:#fbf7f1}.office-count{flex:none;padding:9px 12px;border-radius:999px;background:#e5f4f2;color:#0b6370;font-size:.72rem;font-weight:900}.office-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.office-card{background:#fff;border:1px solid #e2d7c9;border-radius:19px;padding:18px;display:flex;flex-direction:column;min-height:175px;box-shadow:0 9px 24px rgba(11,31,41,.04)}.office-card .office-label{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:#0b6873;font-weight:950}.office-card h3{margin:9px 0 0;font-size:1.02rem}.office-card p{margin:7px 0 15px;color:#758188;font-size:.76rem;line-height:1.5}.office-card a{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:11px;background:#eff7f6;color:#0b5c66;font-size:.76rem;font-weight:900}.office-empty{grid-column:1/-1;padding:22px;border-radius:17px;border:1px dashed #d6cabd;color:#718087;text-align:center;background:#fffdf9}\n.promo-ready-section{padding:0 0 66px;background:#fbf7f1}.promo-ready{border:1px solid #e0d5c7;background:#fffdf9;border-radius:20px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:24px}.promo-ready>div{display:flex;align-items:flex-start;gap:12px}.promo-check{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#dff3ec;color:#168259;font-weight:950;flex:none}.promo-ready strong{display:block}.promo-ready p{margin:4px 0 0;color:#738087;font-size:.73rem;line-height:1.5;max-width:760px}.promo-ready>a{flex:none;padding:11px 15px;border-radius:999px;background:#0b5665;color:#fff;font-weight:900;font-size:.78rem}\n@media(max-width:1000px){.trust-grid{grid-template-columns:1fr 1fr}.advisor-shell{grid-template-columns:1fr}.office-grid{grid-template-columns:1fr 1fr}}\n@media(max-width:680px){.hero-proof{gap:6px}.hero-proof span{font-size:.62rem}.trust-section{padding:58px 0 34px}.trust-head,.office-head{display:block}.trust-map-cta{display:inline-flex;margin-top:18px}.trust-grid,.advisor-grid,.office-grid{grid-template-columns:1fr}.advisor-shell{padding:24px 18px;border-radius:24px}.advisor-section{padding:34px 0 42px}.office-section{padding:54px 0}.office-count{display:inline-flex;margin-top:15px}.promo-ready{display:block}.promo-ready>a{display:inline-flex;margin-top:15px}.advisor-actions{grid-template-columns:1fr 1fr}}\n/* /CATALOGO_V17_TRUST_CSS */\n'''
              s=s.replace('</style>',css+'\n</style>',1)

          # Public office rendering from Supabase.
          if 'function renderOffices()' not in s:
              office_js='''\nfunction cleanOfficeName(name=""){\n  let value=String(name||"").replace(/^OFICINAS?\\s+/i,"").replace(/\\s+/g," ").trim();\n  return value.toLowerCase().replace(/(^|\\s|\\(|-)\\p{L}/gu,m=>m.toUpperCase());\n}\nfunction renderOffices(){\n  const grid=document.getElementById("officeGrid");\n  const count=document.getElementById("officeCount");\n  if(!grid)return;\n  const list=Array.isArray(state.offices)?state.offices:[];\n  if(count)count.textContent=list.length?`${list.length} ubicaciones registradas`:"Ubicaciones registradas";\n  if(!list.length){\n    grid.innerHTML=`<div class="office-empty">No fue posible cargar las oficinas en este momento. Puedes contactar directamente a Eduardo o Carlos desde la sección de asesores.</div>`;\n    return;\n  }\n  grid.innerHTML=list.map(o=>{\n    const name=cleanOfficeName(o.nombre||"Oficina");\n    const ref=o.zona?`Zona de referencia: ${String(o.zona).replace(/_/g," ")}`:`Referencia: ${name}`;\n    const link=o.maps_url||"";\n    return `<article class="office-card"><span class="office-label">Oficina Vive La Baja</span><h3>${esc(name)}</h3><p>${esc(ref)}</p>${link?`<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">Abrir en Google Maps <span>↗</span></a>`:`<span class="office-empty">Liga por confirmar</span>`}</article>`;\n  }).join("");\n}\n'''
              s=s.replace('const state = {',office_js+'\nconst state = {',1)

          s=s.replace('media:[], locations:[], lots:[], lotMedia:[], prices:[], priceMeta:[], config:[],',
                      'media:[], locations:[], offices:[], lots:[], lotMedia:[], prices:[], priceMeta:[], config:[],',1)

          s=s.replace('const [media,locations,lots,lotMedia,prices,priceMeta,config] = await Promise.all([',
                      'const [media,locations,lots,lotMedia,prices,priceMeta,config,offices] = await Promise.all([',1)

          old_cfg='''      fetchAll("precios_terrenos","select=id,esquina_extra&activo=eq.true"),\n      fetchAll("config_publica_v20","select=clave,valor")\n    ]);'''
          new_cfg='''      fetchAll("precios_terrenos","select=id,esquina_extra&activo=eq.true"),\n      fetchAll("config_publica_v20","select=clave,valor"),\n      fetchAll("ubicaciones_oficinas","select=id,nombre,zona,direccion,maps_url,activo&activo=eq.true&order=id.asc")\n    ]);'''
          if old_cfg in s:
              s=s.replace(old_cfg,new_cfg,1)
          else:
              s=re.sub(r'(fetchAll\("config_publica_v20","select=clave,valor"\))(\s*\n\s*\]\);)',r'\1,\n      fetchAll("ubicaciones_oficinas","select=id,nombre,zona,direccion,maps_url,activo&activo=eq.true&order=id.asc")\2',s,count=1)

          s=s.replace('state.config=config;\n    state.exchangeRate=', 'state.config=config;\n    state.offices=offices||[];\n    renderOffices();\n    state.exchangeRate=',1)

          # Slightly stronger public-facing copy in the generic CTA.
          s=s.replace('Después podemos conectar este botón directamente con tu cotizador y tu asesor de WhatsApp.',
                      'Elige un lote, compara su financiamiento y después agenda una cita o habla directamente con un asesor.',1)

          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/patch-catalog-v17.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-catalog-v17.yml
          git commit -m "Polish catalog for public promotion and trust"
          git push origin HEAD:assistant/catalog-v17-confianza
