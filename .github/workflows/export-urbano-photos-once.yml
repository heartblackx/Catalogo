name: Export urbano photos once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-urbano-photos-once.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe host-only proxies
        shell: bash
        run: |
          set -u
          hp='lh3.googleusercontent.com/sitesv/AG8ngQWmZ_OzzYE5NDA2KJeZiQ_6izBuhfxz0IaPGsNZjS_aRNT5rdjT2UKWZnvrt50IeYcKyAf0TgJQ8_O1vpCsj2UQZMLkO7NekVvrVtdmStVOSydzWe9p24KwaDG2mXngQU3wjG5ALBlUcHWMA1kqHx4Htwaha7B3Q3W51wDVg92KmCs8EIacDpHHxNy-=w16383'
          enc=$(python - <<'PY'
          import urllib.parse
          hp='lh3.googleusercontent.com/sitesv/AG8ngQWmZ_OzzYE5NDA2KJeZiQ_6izBuhfxz0IaPGsNZjS_aRNT5rdjT2UKWZnvrt50IeYcKyAf0TgJQ8_O1vpCsj2UQZMLkO7NekVvrVtdmStVOSydzWe9p24KwaDG2mXngQU3wjG5ALBlUcHWMA1kqHx4Htwaha7B3Q3W51wDVg92KmCs8EIacDpHHxNy-=w16383'
          print(urllib.parse.quote(hp,safe=''))
          PY
          )
          declare -a routes=(
            "https://wsrv.nl/?url=${hp}&output=jpg&q=95"
            "https://images.weserv.nl/?url=${hp}&output=jpg&q=95"
            "https://wsrv.nl/?url=${enc}&output=jpg&q=95"
            "https://imageproxy.pimg.tw/resize?url=https%3A%2F%2F${enc}"
          )
          mkdir -p probes
          n=0
          for r in "${routes[@]}"; do
            n=$((n+1)); echo "--- $n $r";
            code=$(curl -L -sS --max-time 60 --connect-timeout 15 -A 'Mozilla/5.0' -o "probes/$n.bin" -w '%{http_code}' "$r" || true)
            echo "HTTP $code"; file "probes/$n.bin" 2>/dev/null || true; ls -l "probes/$n.bin" 2>/dev/null || true;
          done
