name: Export urbano photos once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-urbano-photos-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Capture URBANO development images from Google Site
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          [ -n "$CHROME" ] || { echo "Chrome not found" >&2; exit 1; }
          mkdir -p urbano_fotos
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --window-size=1600,1200 --user-data-dir=/tmp/chrome-urbano about:blank >/tmp/chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break; sleep .25; done
