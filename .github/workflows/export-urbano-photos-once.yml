          async function main(){
            const t=await fetch('http://127.0.0.1:9222/json/new?about:blank',{method:'PUT'}).then(r=>r.json());
            const ws=new WebSocket(t.webSocketDebuggerUrl);
            await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});
            let id=0; const pending=new Map();
            ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result)}};
            const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}))});
            await send('Page.enable'); await send('Runtime.enable'); await send('Emulation.setDeviceMetricsOverride',{width:1600,height:1200,deviceScaleFactor:1,mobile:false});
            await send('Page.navigate',{url:site}); await sleep(7000);
            let index=0;
            for(const [folder,urls] of Object.entries(groups)){
              fs.mkdirSync(path.join('urbano_fotos',folder),{recursive:true});
              for(let i=0;i<urls.length;i++){
                const u=urls[i]; index++;
                const expr=`new Promise(resolve=>{let old=document.getElementById('__capture_img');if(old)old.remove();let wrap=document.createElement('div');wrap.id='__capture_img';wrap.style='position:fixed;left:0;top:0;width:1600px;height:1200px;background:#fff;z-index:2147483647;display:flex;align-items:center;justify-content:center;overflow:hidden';let im=document.createElement('img');im.referrerPolicy='no-referrer-when-downgrade';im.src=${JSON.stringify(u)};im.style='max-width:1600px;max-height:1200px;width:auto;height:auto;object-fit:contain';wrap.appendChild(im);document.body.appendChild(wrap);let done=false;let finish=(ok)=>{if(done)return;done=true;resolve({ok,nw:im.naturalWidth,nh:im.naturalHeight,src:im.currentSrc||im.src})};im.onload=()=>finish(true);im.onerror=()=>finish(false);setTimeout(()=>finish(im.complete&&im.naturalWidth>0),6000)})`;
                const r=await send('Runtime.evaluate',{expression:expr,awaitPromise:true,returnByValue:true});
                const val=r.result?.value||{}; console.log(folder,i+1,val);
                if(!val.ok){ fs.appendFileSync('urbano_fotos/FALLIDAS.txt',`${folder} ${i+1} ${u}\n`); continue; }
                await sleep(300);
                const shot=await send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});
                const fname=`${String(i+1).padStart(2,'0')}.png`;
                fs.writeFileSync(path.join('urbano_fotos',folder,fname),Buffer.from(shot.data,'base64'));
              }
            }
            await send('Runtime.evaluate',{expression:`document.getElementById('__capture_img')?.remove()`});
            ws.close();
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/capture.js
          echo 'Captured files:'
          find urbano_fotos -type f -maxdepth 2 -print
          find urbano_fotos -name '*.png' -type f | wc -l
          zip -r urbano_fotos_por_desarrollo.zip urbano_fotos
