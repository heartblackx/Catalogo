name: Patch catalog V16 filters and currencies
on:
  push:
    branches: ["assistant/catalog-v16-filtros"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/catalog-v16-filtros
      - name: Apply V16 patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch_catalog_v16.py
          python /tmp/patch_catalog_v16.py
      - name: Commit transformed catalog
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve lot filters and USD/MXN quoting"
          git push
