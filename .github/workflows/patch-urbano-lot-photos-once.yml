function developmentPhotoGroup(model,lot){
  const raw=String(
    lot?.desarrollo || lot?.development || model?.name || model?.nombre || model?.desarrollo ||
    model?.cfg?.name || model?.cfg?.nombre || model?.cfg?.desarrollo || ""
  );
  const k=raw.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  if(k.includes("lomas")&&k.includes("valle")) return DEVELOPMENT_FALLBACK_PHOTOS["lomas del valle"];
  if(k.includes("los olivos")) return DEVELOPMENT_FALLBACK_PHOTOS["los olivos"];
  if(k.includes("rancho escondido")) return DEVELOPMENT_FALLBACK_PHOTOS["rancho escondido"];
  if(k.includes("alamar")) return DEVELOPMENT_FALLBACK_PHOTOS["alamar"];
  if(k.includes("paramo")) return DEVELOPMENT_FALLBACK_PHOTOS["paramo"];
  return [];
}
function pickDevelopmentPhoto(model,lot){
  const photos=developmentPhotoGroup(model,lot);
  if(!photos.length) return "";
  const seed=`${lot?.manzana||""}|${lot?.lote||""}|${lot?.id||lot?.inventorynumber||""}`;
  let h=0;
  for(let i=0;i<seed.length;i++) h=((h<<5)-h+seed.charCodeAt(i))|0;
  return photos[(h>>>0)%photos.length] || photos[0] || "";
}
'''
          if 'const DEVELOPMENT_FALLBACK_PHOTOS=' not in s:
              s=s.replace(marker, helper+'\n'+marker, 1)

          old='const developmentPhoto=model.cover || "";'
          new='const developmentPhoto=pickDevelopmentPhoto(model,lot) || model.cover || "";'
          if old not in s and new not in s:
              raise SystemExit('development fallback line not found')
          if new not in s:
              s=s.replace(old,new,1)

          # Safety checks: individual lot photo and lot-specific multimedia must remain ahead of development fallback.
          start=s.index(marker)
          block=s[start:start+1800]
          direct=block.find('foto_lote_public_url')
          lotmedia=block.find('model.lotMedia')
          fallback=block.find('pickDevelopmentPhoto(model,lot)')
          if not (0 <= direct < lotmedia < fallback):
              raise SystemExit(f'priority order invalid: direct={direct}, lotmedia={lotmedia}, fallback={fallback}')
          if 'Imagen del desarrollo' not in s:
              raise SystemExit('required fallback label missing')

          p.write_text(s,encoding='utf-8')
          print('Patched index.html; direct lot photos retain priority, development images rotate by lot.')
          PY
