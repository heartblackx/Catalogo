name: Patch urbano lot photos once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-urbano-lot-photos-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index
        run: python .github/patch_urbano_lot_photos.py
      - name: Validate and publish
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'pickDevelopmentPhoto(model,lot) || model.cover || ""' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes needed.'
          else
            git commit -m 'feat: rotar fotos reales del desarrollo entre lotes'
            git push origin HEAD:main
          fi
