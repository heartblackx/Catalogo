name: Export Google Site images temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-google-site-images-temp.yml

permissions:
  contents: read

env:
  SITE_URL: https://sites.google.com/view/invierte-inteligente-tj/p%C3%A1gina-principal/costa
  PROVIDED_URL: https://lh3.googleusercontent.com/sitesv/AG8ngQXPPqVG_LNkfB8NeJUXmOJWZgHrjcVH3_9ZtXkv8qZ2mK7TPpsck-8O9VbGKFWjT7rfFgwKGkTlCwz8FxENUXFmjAh_CxsmObvpJ-8u6I4HUwrznkoSBOknCQsRvjzeCKUs7BaDJO3Rae6m5dPRNr1K1f3UJjq_FJs8Vi1nCjuYv7MMDVAOSgmsjM7KiP4=w16383

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Google Site and export images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exportadas
          curl -L --fail --retry 3 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36' "$SITE_URL" -o /tmp/site.html
          python - <<'PY'
          import os,re,html,urllib.parse,subprocess,pathlib
          raw=pathlib.Path('/tmp/site.html').read_text(encoding='utf-8',errors='ignore')
          raw=html.unescape(raw).replace('\\u003d','=').replace('\\u0026','&').replace('\\/','/').replace('\\_','_')
          urls=[]
          provided=os.environ['PROVIDED_URL']
          urls.append(provided)
          for u in re.findall(r'https://lh3\.googleusercontent\.com/sitesv/[A-Za-z0-9_\-=]+',raw):
              if u not in urls: urls.append(u)
          pathlib.Path('/tmp/urls.txt').write_text('\n'.join(urls),encoding='utf-8')
          print('URLs encontradas:',len(urls))
          ok=0
          for i,u in enumerate(urls,1):
              proxy='https://images.weserv.nl/?url='+urllib.parse.quote(u,safe='')+'&output=jpg&q=100'
              out=f'exportadas/imagen_{i:02d}.jpg'
              cmd=['curl','-L','--fail','--retry','2','-A','Mozilla/5.0',proxy,'-o',out]
              p=subprocess.run(cmd)
              if p.returncode==0 and pathlib.Path(out).exists() and pathlib.Path(out).stat().st_size>1000:
                  ok+=1
              else:
                  pathlib.Path(out).unlink(missing_ok=True)
          print('Descargadas:',ok)
          if ok==0:
              raise SystemExit('No se pudo descargar ninguna imagen')
          pathlib.Path('exportadas/ENLACES_ORIGINALES.txt').write_text('\n'.join(urls),encoding='utf-8')
          PY
          zip -j fotos_google_site_costa.zip exportadas/*
          ls -lh fotos_google_site_costa.zip
          file exportadas/* | head -20
      - name: Upload photos ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fotos-google-site-costa
          path: fotos_google_site_costa.zip
          if-no-files-found: error
          retention-days: 1
