name: Otay Campestre crop display

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/otay-crop-display.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar recorte limpio a Otay Campestre
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='OTAY_CAMPESTRE_CROP_V1'
          if marker not in s:
              patch='<!-- OTAY_CAMPESTRE_CROP_V1 -->\n<style>img[src*="#otay-crop"]{transform:scale(1.38);transform-origin:50% 12%;object-position:center 12%!important}</style>\n<script>(function(){function c(r){(r||document).querySelectorAll(\'img[src*="#otay-crop"]\').forEach(function(i){var p=i.parentElement;if(p)p.style.overflow="hidden";i.style.transform="scale(1.38)";i.style.transformOrigin="50% 12%";i.style.objectPosition="center 12%"})}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){c(document)});else c(document);new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.nodeType===1){if(n.matches&&n.matches(\'img[src*="#otay-crop"]\'))c(n.parentElement||n);else if(n.querySelectorAll)c(n)}})})}).observe(document.documentElement,{childList:true,subtree:true})})();</script>\n<!-- /OTAY_CAMPESTRE_CROP_V1 -->'
              s=s.replace('</body>',patch+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar ajuste
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: mostrar fotos limpias de Otay Campestre"
          git push origin HEAD:main
