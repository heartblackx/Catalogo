name: Premium catalog detail V37

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/premium-detail-v37.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply premium detail patch
        run: python .github/scripts/premium_detail_v37_patch.py
      - name: Validate catalog markers
        run: |
          grep -q 'CATALOGO_V37_DETAIL_PREMIUM' index.html
          grep -q 'premium-location-shell' index.html
          grep -q 'Mapa del desarrollo' index.html
          grep -q 'Datos clave del terreno' index.html
          grep -q 'mobileQuickNav' index.html
      - name: Validate premium JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="catalogo-v37-premium-detail-script">(.*?)</script>', html, re.S)
          if not m:
              raise SystemExit('Premium script not found')
          Path('/tmp/premium-detail.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/premium-detail.js
      - name: Commit changes
        run: |
          git config user.name 'HBX Catalog Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Sin cambios pendientes'
          else
            git commit -m 'feat: integrar mapa y ficha premium de desarrollos'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
