name: Patch offline registration

on:
  push:
    branches: [main]
    paths:
      - 'sw.js'
      - '.github/workflows/patch-offline-registration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register service worker in index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='OFFLINE_SW_REGISTRATION_V1'
          if marker not in s:
              block='''\n<!-- OFFLINE_SW_REGISTRATION_V1 -->\n<script>\n(function(){\n  if(!('serviceWorker' in navigator)) return;\n  window.addEventListener('load', function(){\n    navigator.serviceWorker.register('/sw.js', {scope:'/'}).then(function(reg){\n      try{reg.update();}catch(e){}\n    }).catch(function(err){console.error('SW registration failed', err);});\n  });\n})();\n</script>\n<!-- /OFFLINE_SW_REGISTRATION_V1 -->\n'''
              if '</body>' in s:
                  s=s.replace('</body>', block+'\n</body>', 1)
              else:
                  s += block
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: registrar service worker para modo offline"
          git push
