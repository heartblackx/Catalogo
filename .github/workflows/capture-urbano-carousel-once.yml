name: Capture urbano carousel once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-urbano-carousel-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Capture URBANO carousels from rendered Google Site
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          [ -n "$CHROME" ] || { echo "Chrome not found" >&2; exit 1; }
          rm -rf urbano_rendered
          mkdir -p urbano_rendered
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --window-size=1200,1000 --user-data-dir=/tmp/chrome-urbano about:blank >/tmp/chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break; sleep .25; done

          cat > /tmp/capture_urbano.js <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const site='https://sites.google.com/view/invierte-inteligente-tj/p%C3%A1gina-principal/urbano';
          const devs=[
            [1,'01_Lomas_del_Valle'],
            [2,'02_Los_Olivos'],
            [3,'03_Rancho_Escondido'],
            [4,'04_Alamar_Residencial'],
            [5,'05_Paramo']
          ];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function main(){
            const t=await fetch('http://127.0.0.1:9222/json/new?about:blank',{method:'PUT'}).then(r=>r.json());
            const ws=new WebSocket(t.webSocketDebuggerUrl);
            await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});
            let id=0; const pending=new Map();
            ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result)}};
            const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}))});
            await send('Page.enable');
            await send('Runtime.enable');
            await send('Emulation.setDeviceMetricsOverride',{width:1200,height:1000,deviceScaleFactor:1,mobile:false});
            await send('Page.navigate',{url:site});
            await sleep(12000);

            const meta=await send('Runtime.evaluate',{expression:`(()=>Array.from(document.querySelectorAll('[aria-label="Carrusel de imágenes"]')).map((c,ci)=>({ci,slides:Array.from(c.querySelectorAll('[role="img"]')).map((s,si)=>({si,bg:getComputedStyle(s).backgroundImage,display:getComputedStyle(s).display,opacity:getComputedStyle(s).opacity}))})))()`,returnByValue:true});
            const cars=meta.result?.value||[];
            fs.writeFileSync('urbano_rendered/carousels.json',JSON.stringify(cars,null,2));
            console.log('CAROUSELS',JSON.stringify(cars.map(x=>[x.ci,x.slides.length])));

            for(const [ci,folder] of devs){
              fs.mkdirSync(path.join('urbano_rendered',folder),{recursive:true});
              const car=cars[ci];
              if(!car){console.log('MISSING CAROUSEL',ci,folder); continue;}
              let n=0;
              for(const slide of car.slides){
                const m=(slide.bg||'').match(/^url\(["']?(.*?)["']?\)$/);
                if(!m) continue;
                const url=m[1]; n++;
                const prepExpr=`new Promise(resolve=>{let old=document.getElementById('__urbano_capture');if(old)old.remove();let box=document.createElement('div');box.id='__urbano_capture';box.style='position:fixed;left:0;top:0;width:1200px;height:1000px;background:#fff;z-index:2147483647;display:flex;align-items:center;justify-content:center;overflow:hidden';let img=document.createElement('img');img.src=${JSON.stringify(url)};img.referrerPolicy='no-referrer-when-downgrade';img.style='width:100%;height:100%;object-fit:contain;display:block';box.appendChild(img);document.body.appendChild(box);let done=false;let finish=(ok)=>{if(done)return;done=true;resolve({ok,nw:img.naturalWidth,nh:img.naturalHeight,src:img.currentSrc||img.src})};img.onload=()=>finish(true);img.onerror=()=>finish(false);setTimeout(()=>finish(img.complete&&img.naturalWidth>0),5000)})`;
                const prep=await send('Runtime.evaluate',{expression:prepExpr,awaitPromise:true,returnByValue:true});
                let val=prep.result?.value||{};
                console.log(folder,n,'overlay-load',val);
                if(!val.ok){
                  const fallback=`(()=>{const cars=Array.from(document.querySelectorAll('[aria-label="Carrusel de imágenes"]'));const c=cars[${ci}];if(!c)return false;const slides=Array.from(c.querySelectorAll('[role="img"]'));slides.forEach((s,j)=>{s.style.setProperty('opacity',j===${slide.si}?'1':'0','important');s.style.setProperty('z-index',j===${slide.si}?'999':'0','important');s.style.setProperty('display','block','important')});c.scrollIntoView({block:'center'});let old=document.getElementById('__urbano_capture');if(old)old.remove();let r=c.getBoundingClientRect();let clone=document.createElement('div');clone.id='__urbano_capture';clone.style='position:fixed;left:0;top:0;width:1200px;height:1000px;background:#fff;z-index:2147483647;display:flex;align-items:center;justify-content:center;overflow:hidden';let shot=document.createElement('div');shot.style='width:100%;height:100%;background-image:'+getComputedStyle(slides[${slide.si}]).backgroundImage+';background-position:center;background-repeat:no-repeat;background-size:contain';clone.appendChild(shot);document.body.appendChild(clone);return true})()`;
                  await send('Runtime.evaluate',{expression:fallback,returnByValue:true});
                  await sleep(700);
                }
                const shot=await send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});
                const fname=String(n).padStart(2,'0')+'.png';
                fs.writeFileSync(path.join('urbano_rendered',folder,fname),Buffer.from(shot.data,'base64'));
              }
            }
            await send('Runtime.evaluate',{expression:`document.getElementById('__urbano_capture')?.remove()`});
            ws.close();
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE

          node /tmp/capture_urbano.js
          echo 'Captured:'
          find urbano_rendered -type f -maxdepth 2 -print
          echo 'PNG count:'
          find urbano_rendered -name '*.png' -type f | wc -l
          zip -r urbano_fotos_renderizadas.zip urbano_rendered
      - uses: actions/upload-artifact@v4
        with:
          name: urbano-fotos-renderizadas
          path: urbano_fotos_renderizadas.zip
          retention-days: 1
