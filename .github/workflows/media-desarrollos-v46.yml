name: Media desarrollos V46

on:
  push:
    paths:
      - '.github/media-v46.ready'

permissions:
  contents: write

jobs:
  apply-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decodificar imágenes WebP aprobadas
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, re

          mapping = [
            ('assets/desarrollos/cielo-galileo/galeria-1.webp.b64', 'assets/desarrollos/cielo-galileo/hero.webp'),
            ('assets/desarrollos/cielo-galileo/galeria-2.webp.b64', 'assets/desarrollos/cielo-galileo/galeria-1.webp'),
            ('assets/desarrollos/lomas-del-prado/hero.webp.b64', 'assets/desarrollos/lomas-del-prado/hero.webp'),
            ('assets/desarrollos/lomas-del-prado/galeria-1.webp.b64', 'assets/desarrollos/lomas-del-prado/galeria-1.webp'),
          ]
          for src_name, dst_name in mapping:
              src = Path(src_name)
              raw = src.read_text(encoding='utf-8', errors='ignore')
              clean = re.sub(r'[^A-Za-z0-9+/]', '', raw)
              if len(clean) % 4 == 1:
                  raise RuntimeError(f'{src}: base64 incompleto')
              clean += '=' * ((4 - len(clean) % 4) % 4)
              data = base64.b64decode(clean, validate=False)
              dst = Path(dst_name)
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(data)
              print(f'{src} -> {dst} ({len(data)} bytes)')
          PY

      - name: Validar imágenes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files = [
            Path('assets/desarrollos/cielo-galileo/hero.webp'),
            Path('assets/desarrollos/cielo-galileo/galeria-1.webp'),
            Path('assets/desarrollos/lomas-del-prado/hero.webp'),
            Path('assets/desarrollos/lomas-del-prado/galeria-1.webp'),
          ]
          for p in files:
              data = p.read_bytes()
              assert len(data) > 1000, f'{p}: archivo demasiado pequeño'
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', f'{p}: no es WebP válido'
              print(f'OK {p} {len(data)} bytes')
          PY

      - name: Limpiar temporales y publicar
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          rm -f assets/desarrollos/**/*.webp.b64
          rm -f assets/desarrollos/cielo-galileo/hero.b64.txt
          rm -f .github/media-v46.ready .github/scripts/media_v46_note.txt
          git config user.name 'HBX Catalog Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'media: publicar Cielo Galileo y Lomas del Prado V46'
          git push
