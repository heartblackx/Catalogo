name: Crop Otay Campestre photos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crop-otay-campestre.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar fotos limpias
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from urllib.request import Request, urlopen
          from io import BytesIO

          urls = [
            'https://lh3.googleusercontent.com/sitesv/AG8ngQWD_9I5czaAKAhE7PzruSVzsiD5LaCsSKlDPm02Mf4kshqBSFL_OKFUrUB5G9SUEg9itUWFKY06CYhf5uPnu1l-4W8q-3Bcgmrm6rrxibdz5LP2XTcbl6t0Pv3wq5uG3nZN6cQd_anHoHcFbH7vzWH9u6J4waYrgN34AdVOEce7yQZrWM83AbMPdXKn=w16383',
            'https://lh3.googleusercontent.com/sitesv/AG8ngQXX53BIkOEtNetwqDB46mOKU0Zx1fiQzRgsz4XkwDZefvy64ugWJLS6GCqs56RZgb6kO-z5dDvMOqHgBSEnRwXSFR9Yfn4Cygt9VR1WbMpMyq1H6FVKC-063fT2Ulpxw4G4i8cGBOZIzLI84yLsoVkaHg6ertj-XxWCrThnwaDnbYJV5gQJ0GLUHQXw=w16383',
            'https://lh3.googleusercontent.com/sitesv/AG8ngQVfB2stMHr6Vj_KVxwYfVn-CHsOuXCZuuSe3NGpJuXzOZWhhYUIwW1pHz0rO_QnA6Tnsd1icLScXNKGqWNuGgs_B06l4B1IIDALT3XiLkG_EgABu_VLWVUC5z73gYHM9PPSE1j1R__k-ABJ1kG_hzGsMAU2NTQY7pxobf8kHyT-JPLvc5ZtfVXgPVdA=w16383',
            'https://lh3.googleusercontent.com/sitesv/AG8ngQWQyg2V-lyUIwCKfaH_RDa1LtMgDaRJswVHyQDRdCzRepjPyktlCeD9Y4CwoucHZV8WFnkN7VpnAtGgipP_Xr1_MVWKQUc8RPaUq_7J7dKV3SOFL5F92APH-GeBq6PxbIiiaOrVYQXAzALCqxwNhqYrTWXM_uHvHlOxGSZawOntzc8XdOc0pYRgI7su9lw=w16383',
            'https://lh3.googleusercontent.com/sitesv/AG8ngQUl-vj6m69Hf_ApaejM2D8PxIdewO7Yii1PER0pmJV2z4h0gdddKZ_diWEojJUl6lJtbk10x_m2RnCfkjOiDzTSxy59AdD1wmWwlgOGGwDDwpkTTcbPADwUpSWOT8U4LTA2MfxjqCx4JjJ8SwmcxOsDVb2Z7TzFDmVzjwwy-Ux99i-rCd-97o2MvjciFFk=w16383',
            'https://lh3.googleusercontent.com/sitesv/AG8ngQXE0YDiXlj1JgwBXHABc96BCAS5j-on_tKvc1MKaKtGTVEPZYqlWJYgYuYs3YClavUmPXP2EWyzbm9vJwmcALxfHSJ3zW0DNo6rSo9veIFtv0y3j2mbAIVPojIVvIVB2qAjd3kxKIO5hbyBqYdDPkk2EAjmXN02wdTaCsPtzY-9e70HDnBFFV5iJy94cw0=w16383',
            'https://lh3.googleusercontent.com/sitesv/AG8ngQVGEVqXqyVdWc607BhuVxMRL5fSKFj1aWs_ekWknGiN55atEW4C_BnGaQ-Sb0ZCS6SwrzS2M0lyu9lxvJ2G7rcB95mzT7ExKnYQljO5sH8aD65l5K-73FTvFQ36Ox4NeNWWegbInC8qMSRdYmHPfrqSmM1wovQoOLNXCNKydXa3PxytBFRO6ucusuf5kuQ=w16383',
            'https://lh3.googleusercontent.com/sitesv/AG8ngQXl9VRW0l8jUTwcsn3mfwo04yLqgDyzVUZaLV9_Y6vt4Vh71qZEOp8_HcRQO2Uzy4Tjf0DsUZdozrbKM9A96ziZaIUd7TGZMr4axjlnwqm63GxvcvuN1lrIghv9L2fKBoq5zQPuyDXmw_dYnIEk-U0Q8VHzmMAp_8wWtau5ZtqMrYac9sWbSy5wm6Qh=w16383'
          ]

          out = Path('assets/desarrollos/urbano/otay-campestre')
          out.mkdir(parents=True, exist_ok=True)
          for old in out.glob('*.jpg'):
              old.unlink()

          headers = {
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'Referer':'https://sites.google.com/',
              'Accept':'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8'
          }

          for i, url in enumerate(urls, 1):
              req = Request(url, headers=headers)
              with urlopen(req, timeout=45) as r:
                  data = r.read()
              im = Image.open(BytesIO(data)).convert('RGB')
              w, h = im.size

              # El arte promocional ocupa la franja curva inferior. Recortamos una
              # ventana 16:9 desplazada a la derecha y hacia el terreno para que
              # sólo permanezca la fotografía original del desarrollo.
              left = int(w * 0.18)
              crop_w = w - left
              crop_h = int(crop_w * 9 / 16)
              top = int(h * 0.15)
              if top + crop_h > int(h * 0.62):
                  top = max(0, int(h * 0.62) - crop_h)
              clean = im.crop((left, top, w, top + crop_h))
              clean.save(out / f'{i:02d}.jpg', 'JPEG', quality=88, optimize=True, progressive=True)
              print(i, im.size, clean.size)
          PY

      - name: Publicar fotos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/desarrollos/urbano/otay-campestre
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "feat: agregar galería limpia de Otay Campestre"
          git push origin HEAD:main
