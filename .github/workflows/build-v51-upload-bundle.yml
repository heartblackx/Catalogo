name: Build V51 Cloudflare upload bundle

on:
  push:
    paths:
      - '.github/workflows/build-v51-upload-bundle.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Verify V51
        run: |
          grep -q 'CATALOGO_V51_HORIZONTAL_DEVELOPMENT_CARDS' index.html
          echo 'V51 verified in index.html'

      - name: Build upload folder
        run: |
          mkdir -p bundle
          shopt -s dotglob extglob
          for item in *; do
            case "$item" in
              .git|.github|scripts|bundle) ;;
              *) cp -a "$item" bundle/ ;;
            esac
          done
          printf 'Catalogo V51 manual Cloudflare upload\nBuilt from main commit: %s\n' "$(git rev-parse HEAD)" > bundle/DEPLOY_VERSION.txt

      - name: Create ZIP
        run: |
          cd bundle
          zip -qr ../Catalogo-V51-Cloudflare.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Catalogo-V51-Cloudflare
          path: Catalogo-V51-Cloudflare.zip
          if-no-files-found: error
          retention-days: 7
