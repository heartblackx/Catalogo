name: Test Google image proxy temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/test-google-image-proxy-temp.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Try proxy variants
        shell: bash
        run: |
          set -u
          URL='https://lh3.googleusercontent.com/sitesv/AG8ngQXPPqVG_LNkfB8NeJUXmOJWZgHrjcVH3_9ZtXkv8qZ2mK7TPpsck-8O9VbGKFWjT7rfFgwKGkTlCwz8FxENUXFmjAh_CxsmObvpJ-8u6I4HUwrznkoSBOknCQsRvjzeCKUs7BaDJO3Rae6m5dPRNr1K1f3UJjq_FJs8Vi1nCjuYv7MMDVAOSgmsjM7KiP4=w16383'
          HOSTPATH="${URL#https://}"
          ENC=$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$URL")
          rm -f imagen*.jpg
          tryit(){
            n="$1"; shift
            echo "=== intento $n ==="
            code=$(curl -L -sS --max-time 30 -A 'Mozilla/5.0' -o "imagen$n.jpg" -w '%{http_code}' "$@" || true)
            echo "HTTP $code"
            if [ -f "imagen$n.jpg" ]; then file "imagen$n.jpg"; stat -c '%s bytes' "imagen$n.jpg"; fi
          }
          tryit 1 "https://images.weserv.nl/?url=$HOSTPATH&output=jpg&q=100"
          tryit 2 "https://images.weserv.nl/?url=ssl:$HOSTPATH&output=jpg&q=100"
          tryit 3 "https://wsrv.nl/?url=$HOSTPATH&output=jpg&q=100"
          tryit 4 "https://res.cloudinary.com/demo/image/fetch/q_100,f_jpg/$ENC"
          for f in imagen*.jpg; do
            [ -f "$f" ] || continue
            if file "$f" | grep -qi 'JPEG image data'; then
              cp "$f" imagen.jpg
              break
            fi
          done
          test -f imagen.jpg
          test $(stat -c%s imagen.jpg) -gt 1000
      - uses: actions/upload-artifact@v4
        with:
          name: prueba-imagen-google
          path: imagen.jpg
          retention-days: 1
