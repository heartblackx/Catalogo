name: Apply urbano media once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-urbano-media-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply verified URBANO galleries
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 --max-time 120 \
            -A 'Mozilla/5.0' \
            'https://sites.google.com/view/invierte-inteligente-tj/p%C3%A1gina-principal/urbano' \
            -o /tmp/urbano.html

          python - <<'PY'
          from pathlib import Path
          import json,re

          src=Path('/tmp/urbano.html').read_text(encoding='utf-8',errors='ignore')
          src=src.replace('\\://','://').replace('\\_','_').replace('\\/','/').replace('\\=','=')
          starts=[m.start() for m in re.finditer(r'aria-label="Carrusel de imágenes"',src)]
          cars=[]
          for i,start in enumerate(starts):
              end=starts[i+1] if i+1<len(starts) else len(src)
              block=src[start:end]
              urls=[]
              for u in re.findall(r'https://lh3\.googleusercontent\.com/sitesv/[A-Za-z0-9_\-=]+',block):
                  if u not in urls: urls.append(u)
              cars.append(urls)

          if len(cars)<6:
              raise SystemExit(f'Expected at least 6 carousels, found {len(cars)}')
          expected=[12,6,6,7,11]
          actual=[len(cars[i]) for i in range(1,6)]
          if actual!=expected:
              raise SystemExit(f'Unexpected URBANO carousel counts: {actual}, expected {expected}')

          urban={
              'Lomas del Valle':cars[1],
              'Los Olivos':cars[2],
              'Rancho Escondido':cars[3],
              'Alamar Residencial':cars[4],
              'Páramo':cars[5],
          }

          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          marker='const LOCAL_DEV_MEDIA = '
          start=text.find(marker)
          end=text.find(';\n\nfunction buildModels()',start)
          if start<0 or end<0:
              raise SystemExit('LOCAL_DEV_MEDIA block not found')
          media=json.loads(text[start+len(marker):end])
          media.update(urban)
          merged=marker+json.dumps(media,ensure_ascii=False,separators=(',',':'))
          text=text[:start]+merged+text[end:]

          old_start='  if(model.id==="otay-campestre" && Array.isArray(model.media) && model.media.length){'
          s=text.find(old_start)
          e=text.find('  const developmentPhoto=model.cover || "";',s)
          if s<0 or e<0:
              raise SystemExit('Old development fallback block not found')
          new='''  if(Array.isArray(model.media) && model.media.length){
            const pool=model.media.filter(x=>x?.public_url);
            if(pool.length){
              const lotIndex=(Array.isArray(model.lots)?model.lots:[]).findIndex(x=>{
                if(lot.id!=null && x.id!=null) return String(x.id)===String(lot.id);
                return canon(x.manzana)===canon(lot.manzana) && canon(x.lote)===canon(lot.lote);
              });
              const key=`${lot.manzana||""}-${lot.lote||""}`;
              let idx=lotIndex;
              if(idx<0){
                let hash=0;
                for(let i=0;i<key.length;i++) hash=((hash*31)+key.charCodeAt(i))>>>0;
                idx=hash;
              }
              const developmentPhoto=pool[idx % pool.length]?.public_url || model.cover || "";
              if(developmentPhoto) return {url:developmentPhoto,type:"desarrollo"};
            }
          }
          '''
          text=text[:s]+new+text[e:]
          text=text.replace('// CLEAN_COSTA_MEDIA_V20','// LOCAL_DEVELOPMENT_MEDIA_V21',1)
          path.write_text(text,encoding='utf-8')
          PY

          grep -q '"Lomas del Valle"' index.html
          grep -q '"Los Olivos"' index.html
          grep -q '"Rancho Escondido"' index.html
          grep -q '"Alamar Residencial"' index.html
          grep -q '"Páramo"' index.html
          grep -q 'const pool=model.media.filter' index.html

          rm -f .github/workflows/apply-urbano-media-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: asignar fotos urbano por desarrollo y variar lotes'
          git push origin HEAD:main
