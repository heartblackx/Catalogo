name: Apply urbano media once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-urbano-media-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply verified URBANO galleries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          urban=json.loads(Path('assets/desarrollos/urbano/media.json').read_text(encoding='utf-8'))
          expected={'Lomas del Valle':12,'Los Olivos':6,'Rancho Escondido':6,'Alamar Residencial':7,'Páramo':11}
          actual={k:len(urban.get(k,[])) for k in expected}
          if actual!=expected:
              raise SystemExit(f'Unexpected verified URBANO media counts: {actual}')

          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          marker='const LOCAL_DEV_MEDIA = '
          start=text.find(marker)
          end=text.find(';\n\nfunction buildModels()',start)
          if start<0 or end<0:
              raise SystemExit('LOCAL_DEV_MEDIA block not found')
          media=json.loads(text[start+len(marker):end])
          media.update(urban)
          merged=marker+json.dumps(media,ensure_ascii=False,separators=(',',':'))
          text=text[:start]+merged+text[end:]

          old='''  if(model.id==="otay-campestre" && Array.isArray(model.media) && model.media.length){
            const key=`${lot.manzana||""}-${lot.lote||""}`;
            let hash=0;
            for(let i=0;i<key.length;i++) hash=((hash*31)+key.charCodeAt(i))>>>0;
            const developmentPhoto=model.media[hash % model.media.length]?.public_url || model.cover || "";
            if(developmentPhoto) return {url:developmentPhoto,type:"desarrollo"};
          }
          '''
          new='''  if(Array.isArray(model.media) && model.media.length){
            const pool=model.media.filter(x=>x?.public_url);
            if(pool.length){
              const lotIndex=(Array.isArray(model.lots)?model.lots:[]).findIndex(x=>{
                if(lot.id!=null && x.id!=null) return String(x.id)===String(lot.id);
                return canon(x.manzana)===canon(lot.manzana) && canon(x.lote)===canon(lot.lote);
              });
              const key=`${lot.manzana||""}-${lot.lote||""}`;
              let idx=lotIndex;
              if(idx<0){
                let hash=0;
                for(let i=0;i<key.length;i++) hash=((hash*31)+key.charCodeAt(i))>>>0;
                idx=hash;
              }
              const developmentPhoto=pool[idx % pool.length]?.public_url || model.cover || "";
              if(developmentPhoto) return {url:developmentPhoto,type:"desarrollo"};
            }
          }
          '''
          if old in text:
              text=text.replace(old,new,1)
          elif 'const pool=model.media.filter(x=>x?.public_url);' not in text:
              raise SystemExit('Development fallback block not found')

          text=text.replace('// CLEAN_COSTA_MEDIA_V20','// LOCAL_DEVELOPMENT_MEDIA_V21',1)
          path.write_text(text,encoding='utf-8')
          PY

          grep -q '"Lomas del Valle"' index.html
          grep -q '"Los Olivos"' index.html
          grep -q '"Rancho Escondido"' index.html
          grep -q '"Alamar Residencial"' index.html
          grep -q '"Páramo"' index.html
          grep -q 'const pool=model.media.filter' index.html

          rm -f .github/workflows/apply-urbano-media-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: asignar fotos urbano por desarrollo y variar lotes'
          git push origin HEAD:main
