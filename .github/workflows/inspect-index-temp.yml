name: Inspect index temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-index-temp.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect relevant code
        shell: bash
        run: |
          echo '=== matches ==='
          grep -nE 'renderDevelopments|getLotPhoto|cover:|gallery|lotMedia|function .*Model|build.*Model|ALL_MODELS|models=' index.html | head -120 || true
          echo '=== around cover ==='
          L=$(grep -n 'cover:' index.html | head -1 | cut -d: -f1 || true)
          if [ -n "$L" ]; then A=$((L-30)); [ $A -lt 1 ] && A=1; B=$((L+80)); sed -n "${A},${B}p" index.html; fi
          echo '=== around render ==='
          L=$(grep -n 'function renderDevelopments' index.html | head -1 | cut -d: -f1 || true)
          if [ -n "$L" ]; then A=$((L-20)); B=$((L+80)); sed -n "${A},${B}p" index.html; fi
