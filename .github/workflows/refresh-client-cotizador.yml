name: Refresh client cotizador

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-client-cotizador.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rediseñar buscador público
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='CLIENT_SEARCH_V18'
          if marker in s:
              print('El rediseño ya está aplicado.')
          else:
              pattern=re.compile(r'<div class="searchbar">\s*<input type="hidden" id="filterType" value="all">.*?<button class="searchbtn" id="searchBtn">Buscar terrenos</button>\s*</div>',re.S)
              replacement='''<!-- CLIENT_SEARCH_V18 -->
    <div class="searchbar client-search-v18">
      <div class="legacy-search-compat" aria-hidden="true">
        <input type="hidden" id="filterType" value="all">
        <input type="number" id="filterDownPayment" value="" tabindex="-1">
        <select id="filterZone" tabindex="-1"><option value="all">Todas las zonas</option></select>
        <button type="button" id="searchBtn">Buscar terrenos</button>
      </div>

      <div class="cs-intro">
        <div class="cs-eyebrow">Cotiza fácil</div>
        <h3>Encuentra un terreno según tu presupuesto</h3>
        <p>Elige cómo prefieres ver los montos y te mostramos opciones disponibles sin complicarte.</p>
      </div>

      <div class="cs-block">
        <span class="cs-label">Moneda</span>
        <div class="cs-segment" role="group" aria-label="Moneda">
          <button type="button" class="cs-choice active" data-client-currency="MXN">MXN</button>
          <button type="button" class="cs-choice" data-client-currency="USD">USD</button>
        </div>
        <p class="cs-note">Puedes consultar los montos en pesos o dólares. El contrato del terreno y los precios oficiales se formalizan en USD. Los importes en MXN son aproximados según el tipo de cambio vigente.</p>
      </div>

      <div class="cs-block">
        <span class="cs-label">¿Cómo quieres buscar?</span>
        <div class="cs-segment cs-search-mode" role="group" aria-label="Forma de búsqueda">
          <button type="button" class="cs-choice active" data-client-mode="down">Por enganche</button>
          <button type="button" class="cs-choice" data-client-mode="monthly">Por mensualidad</button>
        </div>
      </div>

      <div class="field cs-budget-field">
        <label id="clientBudgetLabel">¿Cuánto puedes dar de enganche?</label>
        <input id="clientBudgetAmount" type="number" min="0" step="500" inputmode="decimal" placeholder="Ej. 25,000" autocomplete="off">
      </div>
      <button type="button" class="cs-no-budget" id="clientNoBudget">No sé mi presupuesto · Mostrarme opciones</button>

      <div class="cs-block">
        <span class="cs-label">Ubicación</span>
        <div class="cs-zone-row" role="group" aria-label="Ubicación">
          <button type="button" class="cs-zone active" data-client-zone="all">Todas</button>
          <button type="button" class="cs-zone" data-client-zone="tijuana">Tijuana</button>
          <button type="button" class="cs-zone" data-client-zone="rosarito">Rosarito</button>
          <button type="button" class="cs-zone" data-client-zone="ensenada">Ensenada</button>
        </div>
      </div>

      <button class="searchbtn cs-primary" id="clientSearchBtn" type="button">Ver terrenos que se ajustan a mí</button>
      <div class="cs-helper">También puedes buscar sin escribir una cantidad y comenzar por las opciones con menor pago.</div>
    </div>'''
              s,n=pattern.subn(replacement,s,count=1)
              if n!=1:
                  raise SystemExit(f'No se encontró exactamente un buscador público para reemplazar: {n}')

              s=s.replace('<div class="kicker">Resultados por enganche</div>','<div class="kicker">Opciones para ti</div>',1)
              s=s.replace('<h2 id="searchResultsTitle">Terrenos que se ajustan a tu enganche</h2>','<h2 id="searchResultsTitle">Terrenos que se ajustan a ti</h2>',1)
              s=s.replace('<p id="searchResultsText">Ingresa cuánto puedes dar de enganche y te mostraremos opciones que se ajusten a tu presupuesto.</p>','<p id="searchResultsText">Te mostramos primero opciones sencillas de comparar. Puedes abrir cada desarrollo para revisar todos sus lotes.</p>',1)

              css=r'''
<style id="client-search-v18-styles">
.client-search-v18{display:grid!important;grid-template-columns:1fr!important;gap:14px!important;padding:18px!important}
.client-search-v18 .legacy-search-compat{display:none!important}
.cs-intro h3{margin:3px 0 6px;font-size:1.35rem;line-height:1.15;color:#142b35}
.cs-intro p{margin:0;color:#718087;line-height:1.48;font-size:.86rem}
.cs-eyebrow{font-size:.68rem;font-weight:950;letter-spacing:.14em;text-transform:uppercase;color:#0f777b}
.cs-block{display:grid;gap:8px}
.cs-label{font-size:.7rem;font-weight:950;letter-spacing:.08em;text-transform:uppercase;color:#697980}
.cs-segment{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cs-choice,.cs-zone{min-height:45px;border:1px solid #d7dfe0;border-radius:14px;background:#fff;color:#213742;font:inherit;font-weight:900;cursor:pointer}
.cs-choice.active,.cs-zone.active{border-color:#0c6572;background:#0c6572;color:#fff;box-shadow:0 8px 18px rgba(12,101,114,.16)}
.cs-note{margin:0;padding:10px 12px;border-radius:12px;background:#f6f1e9;color:#68777e;font-size:.7rem;line-height:1.42}
.cs-budget-field{margin:0!important}
.cs-budget-field input{font-size:1.12rem!important}
.cs-no-budget{justify-self:start;border:0;background:transparent;color:#0b6572;font-weight:900;font-size:.78rem;padding:2px 0 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.cs-zone-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.cs-zone{padding:9px 7px;font-size:.74rem}
.cs-primary{margin-top:2px!important;min-height:58px!important;font-size:1.02rem!important}
.cs-helper{text-align:center;color:#7d898e;font-size:.68rem;line-height:1.4}
.client-search-more{grid-column:1/-1;text-align:center;margin-top:2px}
.client-search-more button{border:1px solid #c8d5d6;background:#fff;color:#0b5964;border-radius:12px;padding:11px 18px;font-weight:900;cursor:pointer}
.client-result-zone{display:inline-flex;margin-top:7px;padding:5px 8px;border-radius:999px;background:#eef5f3;color:#43666a;font-size:.62rem;font-weight:900;text-transform:uppercase}
.client-contract-mini{margin-top:8px;color:#7a878d;font-size:.62rem;line-height:1.35}
@media(max-width:620px){
  .client-search-v18{padding:15px!important;gap:12px!important}
  .cs-zone-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cs-intro h3{font-size:1.18rem}
  .cs-note{font-size:.67rem}
}
</style>
'''
              s=s.replace('</head>',css+'\n</head>',1)

              js=r'''
<script id="client-search-v18-script">
(function(){
  const settings={currency:'MXN',mode:'down',zone:'all'};
  let latestRows=[];
  let shown=3;

  function fmt(value,currency){
    if(!Number.isFinite(Number(value))) return 'Consultar';
    const locale=currency==='MXN'?'es-MX':'en-US';
    return '$'+new Intl.NumberFormat(locale,{maximumFractionDigits:2}).format(Number(value))+' '+currency;
  }
  function displayValue(usd){
    const rate=Math.max(1,Number(state.exchangeRate)||17);
    return settings.currency==='MXN'?Number(usd)*rate:Number(usd);
  }
  function zoneName(model){
    const z=(model.zones&&model.zones[0]) || model.loc?.zona || '';
    return String(z||'').trim();
  }
  function zoneMatches(model){
    if(settings.zone==='all') return true;
    const target=canon(settings.zone);
    const zones=[...(model.zones||[]),model.loc?.zona||''].filter(Boolean).map(canon);
    return zones.some(z=>z===target || z.includes(target) || target.includes(z));
  }
  function planFor(model,lot,budgetUSD){
    let plans=[];
    try{plans=planOptionsForLot(model,lot,{downPct:0,term:0})||[]}catch(_){return null}
    plans=plans.filter(x=>Number(x.down)>=0 && Number(x.monthly)>=0 && Number(x.months)>0);
    if(!plans.length)return null;
    if(settings.mode==='down'){
      plans.sort((a,b)=>Number(a.down)-Number(b.down) || Number(a.monthly)-Number(b.monthly));
      const p=plans[0];
      if(budgetUSD>0 && Number(p.down)>budgetUSD*1.03)return null;
      return p;
    }
    plans.sort((a,b)=>Number(a.monthly)-Number(b.monthly) || Number(a.down)-Number(b.down));
    const p=plans[0];
    if(budgetUSD>0 && Number(p.monthly)>budgetUSD*1.03)return null;
    return p;
  }
  function collectRows(ignoreBudget=false){
    const amount=Number(document.getElementById('clientBudgetAmount')?.value)||0;
    const rate=Math.max(1,Number(state.exchangeRate)||17);
    const budgetUSD=ignoreBudget||!amount?0:(settings.currency==='MXN'?amount/rate:amount);
    const rows=[];
    for(const model of state.models||[]){
      if(!zoneMatches(model))continue;
      for(const lot of model.available||[]){
        const p=planFor(model,lot,budgetUSD);
        if(!p)continue;
        const metric=settings.mode==='down'?Number(p.down):Number(p.monthly);
        rows.push({model,lot,plan:p,metric,budgetUSD});
      }
    }
    if(budgetUSD>0){
      rows.sort((a,b)=>(budgetUSD-b.metric)-(budgetUSD-a.metric));
    }else{
      rows.sort((a,b)=>a.metric-b.metric || Number(a.plan.monthly)-Number(b.plan.monthly));
    }
    return rows;
  }
  function distinctDevelopments(rows){
    const out=[],seen=new Set();
    for(const r of rows){
      if(seen.has(r.model.id))continue;
      seen.add(r.model.id);out.push(r);
    }
    return out;
  }
  function renderRows(){
    const grid=document.getElementById('searchLotsGrid');
    const title=document.getElementById('searchResultsTitle');
    const text=document.getElementById('searchResultsText');
    const count=document.getElementById('searchResultsCount');
    if(!grid||!title||!text||!count)return;
    const amount=Number(document.getElementById('clientBudgetAmount')?.value)||0;
    const list=latestRows.slice(0,shown);
    if(!list.length){
      grid.innerHTML='<div class="search-empty" style="grid-column:1/-1"><strong>No encontramos una coincidencia exacta</strong>Prueba otra cantidad o cambia la zona. También puedes buscar sin presupuesto para ver opciones disponibles.</div>';
      count.textContent='0 coincidencias';
      return;
    }
    grid.innerHTML=list.map(({model,lot,plan})=>{
      const info=getLotPhoto(lot,model),photo=info.url;
      const visual=photo
        ? `<div class="search-lot-photo"><img src="${esc(photo)}" alt="" loading="lazy"><span class="search-photo-label">${info.type==='lote'?'Foto del lote':'Imagen del desarrollo'}</span></div>`
        : `<div class="search-lot-photo no-photo"><div class="search-lot-no-photo"><div><strong>${esc(model.name)}</strong><span>Terreno disponible</span></div></div></div>`;
      const down=fmt(displayValue(plan.down),settings.currency);
      const monthly=fmt(displayValue(plan.monthly),settings.currency);
      const zone=zoneName(model);
      return `<article class="search-lot">
        ${visual}
        <div class="search-lot-body">
          <div class="search-lot-title">${esc(model.name)}</div>
          <div class="search-lot-dev">Opción disponible · ${m2(lot.superficie_m2)}</div>
          ${zone?`<span class="client-result-zone">${esc(zone)}</span>`:''}
          <div class="search-lot-data">
            <div><small>Enganche</small><strong>${down}</strong></div>
            <div><small>Mensualidad</small><strong>${monthly}</strong></div>
            <div><small>Plazo</small><strong>${esc(String(plan.months))} meses</strong></div>
            <div><small>Medida</small><strong>${m2(lot.superficie_m2)}</strong></div>
          </div>
          <div class="client-contract-mini">Montos de referencia. El contrato y los precios oficiales se formalizan en USD.</div>
          <button type="button" onclick="openDevelopment('${model.id}')">Ver lotes disponibles →</button>
        </div>
      </article>`;
    }).join('')+(latestRows.length>shown?`<div class="client-search-more"><button type="button" id="clientShowMore">Ver más opciones</button></div>`:'');
    count.textContent=`${latestRows.length} coincidencia${latestRows.length===1?'':'s'}`;
    if(amount>0){
      title.textContent=settings.mode==='down'?'Terrenos que se ajustan a tu enganche':'Terrenos que se ajustan a tu mensualidad';
      text.textContent=`Primero te mostramos opciones cercanas a tu presupuesto en ${settings.currency}.`;
    }else{
      title.textContent='Opciones para empezar';
      text.textContent=`Sin presupuesto definido: mostramos primero las opciones con menor ${settings.mode==='down'?'enganche':'mensualidad'}.`;
    }
    document.getElementById('clientShowMore')?.addEventListener('click',()=>{shown+=6;renderRows()});
  }
  function runSearch(ignoreBudget=false){
    if(!Array.isArray(state.models)||!state.models.length){
      const grid=document.getElementById('searchLotsGrid');
      document.getElementById('searchResultsSection')?.classList.add('show');
      if(grid)grid.innerHTML='<div class="search-empty" style="grid-column:1/-1"><strong>Cargando opciones</strong>Espera un momento y vuelve a intentar.</div>';
      return;
    }
    const exact=distinctDevelopments(collectRows(ignoreBudget));
    let rows=exact;
    if(!rows.length && !ignoreBudget){
      rows=distinctDevelopments(collectRows(true)).slice(0,12);
      const text=document.getElementById('searchResultsText');
      if(text)text.textContent='No encontramos una coincidencia exacta; estas son las opciones disponibles más cercanas para comparar.';
    }
    latestRows=rows;
    shown=3;
    document.getElementById('searchResultsSection')?.classList.add('show');
    renderRows();
    document.getElementById('searchResultsSection')?.scrollIntoView({behavior:'smooth',block:'start'});
  }
  function setCurrency(v){
    settings.currency=v;
    document.querySelectorAll('[data-client-currency]').forEach(b=>b.classList.toggle('active',b.dataset.clientCurrency===v));
  }
  function setMode(v){
    settings.mode=v;
    document.querySelectorAll('[data-client-mode]').forEach(b=>b.classList.toggle('active',b.dataset.clientMode===v));
    const label=document.getElementById('clientBudgetLabel'),input=document.getElementById('clientBudgetAmount');
    if(label)label.textContent=v==='down'?'¿Cuánto puedes dar de enganche?':'¿Cuánto quieres pagar al mes?';
    if(input)input.placeholder=v==='down'?'Ej. 25,000':'Ej. 5,000';
  }
  function setZone(v){
    settings.zone=v;
    document.querySelectorAll('[data-client-zone]').forEach(b=>b.classList.toggle('active',b.dataset.clientZone===v));
    const legacy=document.getElementById('filterZone');
    if(legacy){
      const wanted=[...legacy.options].find(o=>canon(o.value)===canon(v)||canon(o.textContent)===canon(v));
      legacy.value=wanted?wanted.value:'all';
    }
  }

  document.querySelectorAll('[data-client-currency]').forEach(b=>b.addEventListener('click',()=>setCurrency(b.dataset.clientCurrency)));
  document.querySelectorAll('[data-client-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.clientMode)));
  document.querySelectorAll('[data-client-zone]').forEach(b=>b.addEventListener('click',()=>setZone(b.dataset.clientZone)));
  document.getElementById('clientSearchBtn')?.addEventListener('click',()=>runSearch(false));
  document.getElementById('clientNoBudget')?.addEventListener('click',()=>{const i=document.getElementById('clientBudgetAmount');if(i)i.value='';runSearch(true)});
  document.getElementById('clientBudgetAmount')?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();runSearch(false)}});
  setCurrency('MXN');setMode('down');setZone('all');
})();
</script>
'''
              s=s.replace('</body>',js+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
              print('Rediseño aplicado correctamente.')
          PY
      - name: Validación rápida
        shell: bash
        run: |
          grep -q 'CLIENT_SEARCH_V18' index.html
          grep -q 'clientSearchBtn' index.html
          grep -q 'El contrato del terreno y los precios oficiales se formalizan en USD' index.html
      - name: Commit del rediseño
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/refresh-client-cotizador.yml
          git add -A
          git commit -m "feat: simplificar cotizador público para clientes"
          git push origin HEAD:main
