name: Refresh client cotizador

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-client-cotizador.yml'
      - '.github/scripts/update_client_cotizador.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rediseñar buscador público
        run: python .github/scripts/update_client_cotizador.py
      - name: Validar cambios
        run: |
          grep -q 'CLIENT_SEARCH_V18' index.html
          grep -q 'clientSearchBtn' index.html
          grep -q 'El contrato del terreno y los precios oficiales se formalizan en USD' index.html
      - name: Publicar rediseño
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/refresh-client-cotizador.yml
          rm -f .github/scripts/update_client_cotizador.py
          git add -A
          git commit -m "feat: simplificar cotizador público para clientes"
          git push origin HEAD:main
