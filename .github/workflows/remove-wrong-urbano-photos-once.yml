name: Remove wrong urbano photos once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/remove-wrong-urbano-photos-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove wrong urban development media
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          m = re.search(r'const LOCAL_DEV_MEDIA = (\{[^\n]*\});', s)
          if not m:
              raise SystemExit('LOCAL_DEV_MEDIA not found')

          data = json.loads(m.group(1))
          remove = {
              'Lomas del Valle', 'Los Olivos', 'Rancho Escondido',
              'Alamar Residencial', 'Alamar', 'Alamar 2', 'Alamar 3',
              'Páramo', 'Paramo'
          }
          removed = sorted(k for k in list(data) if k in remove)
          for k in removed:
              data.pop(k, None)

          replacement = 'const LOCAL_DEV_MEDIA = ' + json.dumps(data, ensure_ascii=False, separators=(',', ':')) + ';'
          s = s[:m.start()] + replacement + s[m.end():]
          p.write_text(s, encoding='utf-8')

          for k in remove:
              if f'"{k}":[' in replacement:
                  raise SystemExit(f'Key still present: {k}')
          print('Removed:', ', '.join(removed) or '(none)')
          PY

          if git diff --quiet -- index.html; then
            echo 'No index changes needed.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: retirar fotos incorrectas de desarrollos urbano'
          git push origin HEAD:main
