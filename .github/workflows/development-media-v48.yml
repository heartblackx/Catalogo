name: Development media V48

on:
  push:
    paths:
      - '.github/workflows/development-media-v48.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/apply_development_media_v48.py
      - name: Commit
        run: |
          git config user.name 'HBX Catalog Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html worker.js
          git commit -m 'feat: fotos completas por desarrollo y galería separada' || exit 0
          git push
