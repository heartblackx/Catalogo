name: Export Google Site photos

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-google-site-photos-once.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download and zip photos
        run: python .github/export_google_site_photos.py
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: invierte-inteligente-tj-google-site-photos
          path: Invierte_Inteligente_TJ_fotos_Google_Site.zip
          if-no-files-found: error
          retention-days: 1
