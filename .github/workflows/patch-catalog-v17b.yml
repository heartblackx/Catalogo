name: Harden catalog V17 office loading
on:
  push:
    branches: ["assistant/catalog-v17-confianza"]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/catalog-v17-confianza
      - name: Make office directory non-blocking and validate inline JS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('fetchAll("ubicaciones_oficinas","select=id,nombre,zona,direccion,maps_url,activo&activo=eq.true&order=id.asc")', 'fetchAll("ubicaciones_oficinas","select=id,nombre,zona,direccion,maps_url,activo&activo=eq.true&order=id.asc").catch(()=>[])', 1)
          p.write_text(s,encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I):
              if 'application/ld+json' in attrs.lower():
                  continue
              if body.strip(): scripts.append(body)
          Path('/tmp/catalog-inline.js').write_text('\n;\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/catalog-inline.js
          rm -f .github/workflows/patch-catalog-v17b.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-catalog-v17b.yml
          git commit -m "Harden office loading and validate catalog JS"
          git push origin HEAD:assistant/catalog-v17-confianza
