name: Sold out development cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sold-out-development-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch catalog
        run: python .github/scripts/sold_out_patch.py
      - name: Validate patch
        run: |
          grep -q 'CATALOGO_V36_VENDIDOS' index.html
          grep -q 'VENDIDO COMPLETAMENTE' index.html
          grep -q 'id:"vistas-del-rio-vendido"' index.html
      - name: Commit changes
        run: |
          git config user.name 'HBX Catalog Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Sin cambios pendientes'
          else
            git commit -m 'feat: mostrar desarrollos vendidos completamente'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
