name: Fix city preview paths

on:
  push:
    branches: [seo-city-pages-preview]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-city-pages-preview
          fetch-depth: 0
      - name: Make shared asset path portable
        run: |
          python - <<'PY'
          from pathlib import Path
          for slug in ('tijuana','rosarito','ensenada'):
              p=Path(slug)/'index.html'
              s=p.read_text(encoding='utf-8').replace('src="/assets/seo-city.js"','src="../assets/seo-city.js"')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'HBX Catalog Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tijuana/index.html rosarito/index.html ensenada/index.html
          git commit -m 'fix: usar ruta portable en páginas locales'
          git push origin seo-city-pages-preview
