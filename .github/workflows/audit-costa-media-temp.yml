name: Audit Costa media temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-costa-media-temp.yml
      - .github/costa_exact_media_manifest.json

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact development images
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re, urllib.request, mimetypes
          from urllib.error import HTTPError, URLError

          data=json.load(open('.github/costa_exact_media_manifest.json',encoding='utf-8'))
          out=pathlib.Path('costa_exact_media')
          out.mkdir(exist_ok=True)
          report=[]
          for dev,urls in data.items():
              folder=out/re.sub(r'[^A-Za-z0-9_-]+','_',dev).strip('_')
              folder.mkdir(exist_ok=True)
              for i,url in enumerate(urls,1):
                  req=urllib.request.Request(url,headers={
                    'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
                    'Referer':'https://sites.google.com/'
                  })
                  try:
                      with urllib.request.urlopen(req,timeout=40) as r:
                          blob=r.read()
                          ctype=(r.headers.get('Content-Type') or '').lower()
                      ext='.jpg'
                      if 'png' in ctype: ext='.png'
                      elif 'webp' in ctype: ext='.webp'
                      p=folder/f'{i:02d}{ext}'
                      p.write_bytes(blob)
                      ok=len(blob)>1000 and ctype.startswith('image/')
                      report.append(f'{dev}\t{i:02d}\t{ctype}\t{len(blob)}\t{ok}\t{url}')
                  except Exception as e:
                      report.append(f'{dev}\t{i:02d}\tERROR\t0\tFalse\t{url}\t{type(e).__name__}:{e}')
          (out/'AUDIT.tsv').write_text('\n'.join(report),encoding='utf-8')
          print('\n'.join(report))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: costa-exact-media-audit
          path: costa_exact_media
          retention-days: 1
